name: Build WAMount

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WinFsp
      shell: pwsh
      run: |
        Write-Host "Downloading WinFsp..."
        $winfspUrl = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
        $winfspInstaller = "$env:TEMP\winfsp.msi"
        Invoke-WebRequest -Uri $winfspUrl -OutFile $winfspInstaller

        Write-Host "Installing WinFsp..."
        Start-Process msiexec.exe -ArgumentList "/i", $winfspInstaller, "/qn", "/norestart" -Wait

        Write-Host "WinFsp installed successfully"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 -DWINFSP_PATH="C:\Program Files (x86)\WinFsp" ..

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.config }} --verbose

    - name: List build output
      shell: pwsh
      run: |
        Write-Host "Build output files:"
        Get-ChildItem -Path build\${{ matrix.config }} -Recurse

    - name: Upload artifacts (Release only)
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: wamount-windows-x64
        path: |
          build/Release/wamount.exe
          README.md
          QUICKSTART.md
          LICENSE
        retention-days: 30

    - name: Upload debug artifacts
      if: matrix.config == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: wamount-windows-x64-debug
        path: |
          build/Debug/wamount.exe
          build/Debug/wamount.pdb
        retention-days: 7

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Display build info
      run: |
        echo "✅ WAMount build completed successfully!"
        echo ""
        echo "📦 Artifacts available:"
        echo "   - wamount-windows-x64 (Release build)"
        echo "   - wamount-windows-x64-debug (Debug build)"
        echo ""
        echo "📥 Download artifacts from the Actions tab"
        echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
